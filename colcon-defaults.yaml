# Contains colcon default settings for user overlay containers.
build:
  # Enable this for bidirectional syncing from the UI
  symlink-install: true
  allow-overriding:
    - feetech_ros2_driver
    - franka_description
    - kortex_description
    - robotiq_description
    - ur_description
  mixin:
    # Enable ccache support
    - ccache
    # Multithreaded linker to speed up linking step during compilation
    - lld
    - compile-commands
    # Debug info and build testing for dev workflows
    - rel-with-deb-info
    - build-testing-on
    # No coverage mixins, like the colcon defaults MoveIt Pro installs for
    # the runtime user. coverage-pytest forces AMENT_CMAKE_PYTEST_WITH_COVERAGE
    # on, and the MoveIt Pro image ships without pytest-cov, so every
    # ament_add_pytest_test call warns at configure time. coverage-gcc
    # instruments every library, Behavior plugins included, which slows builds
    # and can slow multithreaded code at runtime. To collect coverage, copy
    # this file, add the mixin you want, and point COLCON_DEFAULTS_FILE at the
    # copy; --mixin replaces this list rather than extending it.
test:
  event-handlers:
    - console_direct+
    - desktop_notification+
