# Simulation planning speed of the pick-and-stack Objectives, as fractions of
# the joint limits in config/moveit/joint_limits.yaml. reBot Stack Motion
# loads this file before any motion. Edit it to change the simulation's speed,
# then rebuild rebot_bench_sim.

joint:
  velocity_scale_factor: 1.0
  acceleration_scale_factor: 1.0

cartesian:
  velocity_scale_factor: 1.0
  acceleration_scale_factor: 1.0

gripper:
  velocity_scale_factor: 1.0
  acceleration_scale_factor: 1.0
