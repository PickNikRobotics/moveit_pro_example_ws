upstream:
  repository: https://github.com/PickNikRobotics/moveit_pro_franka_ws.git
  commit: 43adda52a6b8aebce311b60743d29f274a8fdeca
  branch: fm/franka-ws-restructure
vendored_paths:
  - LICENSE
  - NOTICE
  - LICENSES/Apache-2.0.txt
  - src/fr3_solo_mock
  - src/mobile_fr3_duo_mock
  - src/mobile_fr3_duo_sim
pruned_paths:
  - src/fr3_solo_sim, src/fr3_duo_mock and src/fr3_duo_sim, which no package in this workspace uses
  - src/franka_behaviors, which upstream excludes from its own build
  - src/external_dependencies, because this workspace vendors its own franka_description 2.9.0 under src/external_dependencies/franka_config
  - workspace files (Dockerfile, docker-compose.yaml, colcon-defaults.yaml, README.md, AGENTS.md, CLAUDE.md)
apache_paths:
  - LICENSES/Apache-2.0.txt
  - src/mobile_fr3_duo_sim/mjcf/assets
notes:
  - Byte-identical copy of the listed paths at the pinned commit; nothing is modified.
  - kitchen_sim is based on fr3_solo_mock, and market_sim on mobile_fr3_duo_sim, which is based on mobile_fr3_duo_mock.
  - The packages depend on franka_description, provided by src/external_dependencies/franka_config (release 2.9.0, the release upstream pins).
  - Binary files matching workspace Git LFS patterns are stored as LFS objects; checked-out bytes match upstream.
