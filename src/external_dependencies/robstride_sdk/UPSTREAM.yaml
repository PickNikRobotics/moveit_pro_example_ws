notes:
  - RobStride private-protocol encode/decode and the SocketCAN transport used by robstride_hardware_interface. Vendored from griswaldbrooks/RobstrideSDK, a fork of kmj060703/RobstrideSDK; the snapshot matches the pinned fork commit exactly.
  - The fork fixes Type 0x15 source routing and little-endian fault/warning decoding, exposes warning_bits, and adds offline CTest regressions. All SDK changes live on the fork branch, not in this snapshot.
  - Its per-model limit tables were checked against this bench's own stored motor parameters: RS00 14 Nm torque and 16 A current, RS06 36 Nm and 57 A, matching the readback from the arm's seven motors.
  - MotorState.last_feedback_ns records only complete Type-2 temperature/run-state samples; fault, parameter and malformed frames cannot refresh temperature freshness. Decoder regressions cover missing/default and non-temperature traffic.
