notes:
  - Pinned to upstream tag 0.2.2 (the exact source of the ros-jazzy-feetech-ros2-driver 0.2.2 binary), plus the torque-lifecycle change; upstream main is deliberately not tracked (it moves the joint configuration to YAML and has no release).
  - The change makes servo torque follow the ros2_control lifecycle for so101_base_config's real branch, off at on_configure, on at on_activate for joints with a command interface, off at on_deactivate. Upstream 0.2.2 only ever turns torque off. Torque is written per servo through set_torque so each servo's status packet is checked, read_response rejects a non-zero working-status byte, and on_activate fails instead of seeding a zero command when the initial read fails.
  - set_torque's reply now carries a status-aware error (CommunicationProtocol::StatusResult / ServoReplyError) distinguishing "the servo answered but reported a fault" (is_fault=true) from "no valid reply" (is_fault=false), instead of the plain-string Result every other call uses. FeetechHardwareInterface::set_torque logs an is_fault torque-off acknowledgement as a warning and still succeeds the lifecycle transition - a faulted servo (e.g. overload) still turns its torque off - while torque-on and any non-fault failure still fail it. read_response (used by every other write) is unchanged in signature; it now delegates to read_response_status and discards the is_fault flag.
  - write() (and set_torque, directly) now retry a no-reply/bad-packet failure (is_fault=false) up to 3 attempts total with a short pause between, via the private write_with_retry helper; a fault reply (is_fault=true) is never retried, since the servo did answer. Bench evidence: the very first bus packet after the port opens (on_init's new p_cofficient write, see the servo-PID-gain config change) can get no reply on this adapter even on an otherwise-healthy bus - seen both here and in LeRobot's own calibration CLI, whose first WRITE failed twice while a 300/300 read stress was clean.
  - on_init's p/i/d_cofficient writes are EEPROM (the servo commits to flash before replying), unlike every other register this driver writes, which is SRAM and answers within the 10 ms control-loop timeout. SerialPort::set_timeout/timeout and CommunicationProtocol::set_reply_timeout/reply_timeout let on_init raise the timeout to 100 ms around just that write and restore it after - retrying at 10 ms only made it worse, since a retry re-sends before the servo's slower flash-commit ack arrives, and the loop timeout used everywhere else (position commands) must stay short. on_init also now reads the register first and skips the write when the servo already holds the value, which avoids the EEPROM write (and its ack wait) entirely on a normal restart.
  - Building this package in the workspace shadows the apt binary, rosdep --ignore-src no longer installs ros-jazzy-feetech-ros2-driver, and colcon-defaults.yaml lists the package under allow-overriding for images that already carry it.
