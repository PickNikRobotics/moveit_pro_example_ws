###############################################################
#
#  This overlays so101_base_config to force mock hardware. Everything else -
#  the runtime launch file, the wiggle-test bridge and Mirror SO101 Follower
#  Objective, the description, controllers - is inherited unchanged.
#
###############################################################

based_on_package: "so101_base_config"

hardware:
  robot_description:
    urdf_params:
      # Force mock regardless of the base config's default.
      - hardware_interface: "mock"
