
# Planning groups to use in JointJog, and their corresponding JVC controllers.
# The number of elements in `planning_groups` and `controllers` must match.
# 'manipulator' is not listed: it contains the wheels of the 'ridgeback' mobile base, which a Joint Velocity Controller
# rejects. Drive the base through Pose Jog or base jogging instead.
planning_groups: ['arm_only']
controllers: ['arm_only_joint_velocity_controller']
