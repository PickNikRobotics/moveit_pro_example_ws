# MPPI publishes its chosen trajectory on /optimal_trajectory, not the
# /local_plan that DWB uses, so point the Local Plan overlay there. It stays
# silent unless FollowPath.visualize is true. Note it is stamped in odom while
# /plan is in map, so an AMCL correction shifts the two overlays against
# each other.
nav2LocalPlanTopic: /optimal_trajectory

# The velocity smoother's output is what reaches the mecanum wheels, and it is
# unstamped, so set the frame the command is expressed in. The controller that
# subscribes here starts inactive and is only activated by a Nav2 Objective, so the
# overlay stays silent during teleop and whole-body motion, which drive the base
# through platform_velocity_controller instead.
nav2CmdVelTopic: /platform_velocity_controller_nav2/cmd_vel_unstamped
nav2CmdVelFrame: ridgeback_base_link
