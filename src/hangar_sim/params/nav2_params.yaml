amcl:
  ros__parameters:
    use_sim_time: True
    # Do NOT self-seed. A robot does not power on at a known pose, so a config that
    # hands the filter one is a simulator convenience that hides the real startup
    # path: on hardware the same config would assert a pose nobody measured, and
    # nothing downstream could tell the difference between that and a real fix.
    #
    # The "Localize Robot" Objective seeds the filter from an operator's click
    # instead, and tightens that seed in place before the robot moves. "Refine
    # Localization In Place" runs that same refinement on its own, seeded from the
    # estimate the filter already holds, for the bumped-robot case.
    #
    # Until one of those runs, beluga publishes NOTHING -- no /amcl_pose, and no
    # map -> odom transform at all. Measured in simulation rather than inferred:
    # with this setting the node reports lifecycle state ACTIVE, consumes 356
    # /scan_merged messages, and still emits zero /amcl_pose while map -> odom
    # raises ConnectivityException. Publishing a seed makes the edge appear at once.
    #
    # beluga's binary does carry a "distributed across the map" initialisation
    # string, which reads like it global-initialises and broadcasts from an
    # unconverged cloud. It does not do that here. Reading the strings gave the
    # opposite answer to running it, which is worth remembering before trusting a
    # symbol dump about startup behaviour.
    #
    # That distinction has teeth in this workspace: map -> odom is the only link
    # between the MuJoCo scene frames (cameras under mj_world -> map) and MoveIt's
    # planning frame (world under odom). With no such edge the TF tree is in two
    # disconnected pieces, so until the filter is seeded every point-cloud
    # Objective fails its transform lookup outright -- not just the navigation
    # ones, and not with a pose that is merely wrong. The integration test seeds
    # the filter once in a fixture for exactly this reason, and waits for the
    # map -> odom edge to appear, because with no edge before the seed the edge
    # appearing IS the evidence the seed was consumed -- see localized_robot in
    # test/objectives_integration_test.py.
    #
    # The navigation Objectives still open with the SetInitialPose Behavior, which
    # re-seeds the filter at the robot's current pose. That now REQUIRES the filter
    # to have been seeded already: SetInitialPose reads map -> ridgeback_base_link,
    # and with no map -> odom edge there is nothing for it to resolve through. It
    # used to succeed at cold boot only because that transform was the simulator's,
    # which is the crutch this change removes.
    #
    # So each of those Objectives -- and "Refine Localization In Place", which opens
    # on the same lookup -- wraps that first node in a three-branch Fallback rather
    # than letting it fail opaquely. A filter whose estimate resolves takes the first
    # branch and runs exactly as before. When it does NOT resolve and an operator is
    # attached, the second branch says so and runs the "Localize Robot" subtree
    # inline, so the run stops for the marker once and then continues on its own; it
    # does not fail, and it does not send the operator to a different Objective.
    # HEADLESS, the second branch is skipped and the third reports the same
    # unresolved transform with no UI to prompt, then fails. That keeps a headless
    # run from blocking on a marker nobody can answer, which matters because "Refine
    # Localization In Place" is the one Objective of this feature the integration
    # suite executes.
    #
    # NOTE WHAT THOSE BRANCHES DO NOT CLAIM. SetInitialPose and GetLatestTransform
    # both fail on ANY unavailable map -> ridgeback_base_link, so the tree cannot
    # tell a filter that was never seeded from one whose good estimate went briefly
    # unavailable -- amcl restarting, stalling or pausing past the TF buffer window
    # looks identical, and nothing in the tree carries the history that would
    # separate them. Every message on these paths therefore states the observed
    # symptom (the transform did not resolve), offers both possibilities, and warns
    # that if the robot WAS already localized, re-localizing replaces that estimate
    # with the pose the operator places. That warning is not hypothetical: measured
    # on this branch, a filter at 9.4 cm error left at 95.6 cm after a rejected seed
    # was restored over it. Distinguishing the two cases is follow-up work.
    #
    # Both of those branches turn on IsUserAvailable, and it is worth knowing what
    # that Behavior actually tests: whether anything SUBSCRIBES to
    # /failure_reason_collector. Its class docstring still claims it looks for a
    # /trajectory_bridge node, which is stale. So the headless fast-fail rests on
    # nothing subscribing to /failure_reason_collector -- checkable at runtime, and
    # checked: on the running headless simulator that topic had 0 subscribers and 1
    # publisher, and no trajectory_bridge node existed at all. The third branch
    # re-tests the same condition through an Inverter, so a failure that happens
    # after an operator really did answer the marker is not mislabelled as "no UI".
    #
    # Either way the operator order is "Localize Robot", then navigate -- the same
    # order hardware needs.
    #
    # beluga_amcl is 2D: only x, y and yaw are declared (no z). DO NOT DELETE the
    # initial_pose block below because this setting is false: amcl no longer reads
    # it, but the integration suite does. `_spawn_pose_from_nav2_params` in
    # test/objectives_integration_test.py reads x, y and yaw straight out of it and
    # seeds the filter with them, and the `localized_robot` fixture that does so is
    # autouse and module-scoped -- so removing the block does not relax a config,
    # it raises a KeyError that fails every Objective in the suite for a reason
    # that looks nothing like the cause.
    set_initial_pose: false
    initial_pose:
      x: 0.0
      y: 0.0
      yaw: 0.0
      covariance_x: 0.25
      covariance_y: 0.25
      covariance_yaw: 0.0685
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.1
    alpha4: 0.05
    alpha5: 0.05
    base_frame_id: "ridgeback_base_link"
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 25.0
    laser_min_range: 0.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 5000
    min_particles: 1000
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    resample_interval: 1
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan_merged

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: ridgeback_base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    #
    # Do NOT list the stock nav2 BT plugin libraries in `plugin_lib_names` here. Since
    # Jazzy, bt_navigator always loads the default nav2 set implicitly and the parameter
    # is additive, so re-listing them double-registers every node and configure fails
    # with "ID [ComputePathToPose] already registered". Only custom user libraries
    # belong in `plugin_lib_names`.

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 20.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.4
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 500
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 0.5
      vx_min: -0.35
      vy_max: 0.5
      wz_max: 1.9
      iteration_count: 1
      # Seed each rollout from the last commanded velocity instead of the
      # reported odometry. In this simulation on Jazzy the odometry lags enough
      # to pin the commanded speed near a third of vx_max (moveit_pro issue
      # #21202). Requires nav2_mppi_controller >= 1.3.13, which the workspace
      # Dockerfile installs; older builds ignore the parameter without error.
      open_loop: true
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      # The Ridgeback is a mecanum (holonomic) base, but the controller runs in
      # diff-drive mode on purpose: the robot reorients then drives forward,
      # which keeps motion simple. DiffDrive constrains vy to 0, so vy_std/vy_max
      # above are inactive; they are retained for an easy switch to motion_model
      # "Omni" if holonomic strafing is wanted later.
      motion_model: "DiffDrive"
      # The only switch that makes MPPI publish /optimal_trajectory, which the
      # Desktop App draws as the Local Plan overlay. Its /trajectories markers
      # are built only while something subscribes; `ros2 param set` toggles it live.
      visualize: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      # ObstaclesCritic:
      #   enabled: true
      #   cost_power: 1
      #   repulsion_weight: 1.5
      #   critical_weight: 20.0
      #   consider_footprint: false
      #   collision_cost: 10000.0
      #   collision_margin_distance: 0.1
      #   near_goal_distance: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true
      # VelocityDeadbandCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 35.0
      #   deadband_velocities: [0.05, 0.05, 0.05]
      # TwirlingCritic:
      #   enabled: true
      #   twirling_cost_power: 1
      #   twirling_cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: ridgeback_base_link
      use_sim_time: True
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: "[[0.45, 0.375], [0.45, -0.375], [-0.45, -0.375], [-0.45, 0.375]]"
      footprint_padding: 0.025
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.75
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan_front scan_rear
        scan_front:
          topic: /scan_front_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 4.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
          transform_tolerance: 0.3
          inf_is_valid: false
          qos_overriding_options:
            policy_kinds: [reliability]
            reliability: best_effort
        scan_rear:
          topic: /scan_rear_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 4.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
          transform_tolerance: 0.3
          inf_is_valid: false
          qos_overriding_options:
            policy_kinds: [reliability]
            reliability: best_effort
      always_send_full_costmap: True
      transform_tolerance: 0.3


global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: ridgeback_base_link
      use_sim_time: True
      footprint: "[[0.45, 0.375], [0.45, -0.375], [-0.45, -0.375], [-0.45, 0.375]]"
      footprint_padding: 0.025
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan_front scan_rear
        scan_front:
          topic: /scan_front_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
          transform_tolerance: 0.3
          inf_is_valid: false
          qos_overriding_options:
            policy_kinds: [reliability]
            reliability: best_effort
        scan_rear:
          topic: /scan_rear_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
          transform_tolerance: 0.3
          inf_is_valid: false
          qos_overriding_options:
            policy_kinds: [reliability]
            reliability: best_effort
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.7
      always_send_full_costmap: True
      transform_tolerance: 0.3

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    global_frame: odom
    robot_base_frame: ridgeback_base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 3.6
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [1.0, 1.0, 1.0]
    min_velocity: [-1.0, -1.0, -1.0]
    max_accel: [2.5, 2.5, 3.2]
    max_decel: [-2.5, -2.5, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

slam_toolbox:
  ros__parameters:
    use_sim_time: True

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: ridgeback_base_link
    scan_topic: /scan_front_filtered
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 5.0
    resolution: 0.05
    max_laser_range: 24.9
    minimum_time_interval: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: false
    use_scan_barycenter: true
    minimum_travel_distance: 0.3
    minimum_travel_heading: 0.3
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: false
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
