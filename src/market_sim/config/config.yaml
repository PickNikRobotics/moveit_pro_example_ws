# Husky A300 from lunar_sim in the supermarket, with Beluga AMCL and Nav2.
runtime_launch_file:
  package: market_sim
  path: launch/runtime.launch.xml
hardware:
  launch_control_node: true
  launch_robot_state_publisher: true
  robot_description:
    urdf:
      package: market_sim
      path: description/husky_a300_mujoco.xacro
    srdf:
      package: lunar_sim
      path: config/moveit/husky_a300.srdf
    urdf_params:
    - mujoco_model: mjcf/scene.xml
    - mujoco_viewer: false
    - mujoco_keyframe: default
    - enable_vo: false
  additional_driver_launch_file:
    package: market_sim
    path: launch/sim/robot_drivers_to_persist_sim.launch.py
ros_global_params:
  use_sim_time: false
moveit_params:
  joint_group_name: base
  kinematics:
    package: lunar_sim
    path: config/moveit/kinematics.yaml
  pose_jog:
    package: lunar_sim
    path: config/moveit/pose_jog.yaml
  joint_jog:
    package: lunar_sim
    path: config/moveit/joint_jog.yaml
  publish:
    planning_scene: true
    geometry_updates: true
    state_updates: true
    transforms_updates: true
ros2_control:
  config:
    package: market_sim
    path: config/control/market_a300.ros2_control.yaml
  controllers_active_at_startup:
  - joint_state_broadcaster
  - platform_velocity_controller
  - imu_sensor_broadcaster
  controllers_inactive_at_startup: []
  controllers_not_managed: []
  controller_shared_topics:
    /cmd_vel:
    - /platform_velocity_controller/cmd_vel
    /odom:
    - /platform_velocity_controller/odom
objectives:
  behavior_loader_plugins:
    core:
    - moveit_pro::behaviors::CoreBehaviorsLoader
    - moveit_pro::behaviors::MTCCoreBehaviorsLoader
    - moveit_pro::behaviors::ConverterBehaviorsLoader
    - moveit_pro::behaviors::VisionBehaviorsLoader
    - moveit_pro::behaviors::MujocoBehaviorsLoader
    - moveit_pro::behaviors::NavBehaviorsLoader
    lunar_sim:
    - lunar_sim_behaviors::LunarSimBehaviorsLoader
  objective_library_paths:
    core_objectives:
      package_name: moveit_pro_objectives
      relative_path: objectives/core
    mujoco_objectives:
      package_name: moveit_pro_objectives
      relative_path: objectives/mujoco
    lunar_sim_objectives:
      package_name: lunar_sim
      relative_path: objectives
    market_sim_objectives:
      package_name: market_sim
      relative_path: objectives
  waypoints_file:
    package_name: lunar_sim
    relative_path: waypoints/waypoints.yaml
