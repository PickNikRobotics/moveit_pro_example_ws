# Market navigation for the lunar_sim A300 differential-drive base.
# The simulator stamps wall time, so use_sim_time is false throughout.

amcl:
  ros__parameters:
    use_sim_time: false
    # The robot boots at the world and map origin in every keyframe.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      yaw: 0.0
    # Yaw and rolling scale are calibrated; lateral skid during turns remains unobserved.
    alpha1: 0.02
    alpha2: 0.001
    alpha3: 0.001
    alpha4: 0.1
    alpha5: 0.001
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 40.0
    laser_min_range: 0.1
    laser_model_type: "likelihood_field"
    # Beluga subsamples the merged scan's rays evenly.
    max_beams: 1440
    max_particles: 6000
    min_particles: 4000
    pf_err: 0.05
    pf_z: 0.99
    # Disable random injection for this known, static simulation map.
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    # Allow lateral skid uncertainty while the controller remains differential drive.
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.04
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.01
    update_min_d: 0.02
    z_hit: 0.95
    z_max: 0.05
    z_rand: 0.05
    z_short: 0.05
    # Both lidars must have matching acquisition stamps for one coherent observation.
    scan_topic: /scan_mapping

map_server:
  ros__parameters:
    use_sim_time: false
    # Set by the persist launch file to this package's maps/market.yaml.
    yaml_filename: ""

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom_filtered
    bt_loop_duration: 10
    default_server_timeout: 500
    wait_for_service_timeout: 1000
    # Leave plugin_lib_names unset: Jazzy loads the stock nav2 BT nodes already.

controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /odom_filtered
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    # Differential drive has no lateral command.
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 20.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    # Turn in place toward a new path before following it, so the base never arcs into a shelf it faces.
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      # Turn rate and acceleration within the base's limits (wz_max, the velocity smoother).
      rotate_to_heading_angular_vel: 1.2
      max_angular_accel: 1.2
      # Aim at the path well ahead and turn until nearly aligned, so the base drives the aisles straight.
      forward_sampling_distance: 1.5
      angular_dist_threshold: 0.35
      angular_disengage_threshold: 0.1
      # Replans to the same goal must not restart the initial heading alignment.
      rotate_to_heading_once: true
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      ay_min: -3.0
      az_max: 3.5
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4
      # Simulation navigation speeds within the A300 controller limits.
      vx_max: 1.2
      vx_min: -1.2
      vy_max: 0.0
      wz_max: 1.2
      iteration_count: 1
      # Seed rollouts from the last command, not lagging odometry; needs MPPI 1.3.13 (Dockerfile).
      open_loop: true
      prune_distance: 4.0
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics:
        [
          "ConstraintCritic",
          "CostCritic",
          "GoalCritic",
          "GoalAngleCritic",
          "PathAlignCritic",
          "PathFollowCritic",
          "PathAngleCritic",
          "PreferForwardCritic",
        ]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        # Weighted up to keep trajectories away from the racks; near_collision_cost stays at the
        # inscribed cost, since a lower one would penalise every aligned trajectory in an aisle.
        cost_weight: 8.0
        near_collision_cost: 253
        critical_cost: 1000.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        # Check the footprint at every trajectory point.
        trajectory_point_step: 1
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      # The A300 bumpers and wheels; a test keeps both costmaps equal.
      footprint: "[[-0.60, -0.40], [0.60, -0.40], [0.60, 0.40], [-0.60, 0.40]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan_front scan_rear
        scan_front:
          topic: /scan_front
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 4.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
          inf_is_valid: false
          # The flattener publishes best effort.
          qos_overriding_options:
            policy_kinds: [reliability]
            reliability: best_effort
        scan_rear:
          topic: /scan_rear
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 4.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
          inf_is_valid: false
          # The flattener publishes best effort.
          qos_overriding_options:
            policy_kinds: [reliability]
            reliability: best_effort
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # A slower decay keeps a cost gradient across the wider inflation, pushing the controller off the racks.
        cost_scaling_factor: 2.0
        # The footprint's circumscribed radius, rounded up to the next 0.1 m.
        inflation_radius: 0.8
      always_send_full_costmap: true
      transform_tolerance: 0.3

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # The A300 bumpers and wheels; a test keeps both costmaps equal.
      footprint: "[[-0.60, -0.40], [0.60, -0.40], [0.60, 0.40], [-0.60, 0.40]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan_front scan_rear
        scan_front:
          topic: /scan_front
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
          inf_is_valid: false
          # The flattener publishes best effort.
          qos_overriding_options:
            policy_kinds: [reliability]
            reliability: best_effort
        scan_rear:
          topic: /scan_rear
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
          inf_is_valid: false
          # The flattener publishes best effort.
          qos_overriding_options:
            policy_kinds: [reliability]
            reliability: best_effort
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        # The footprint's circumscribed radius, rounded up to the next 0.1 m.
        inflation_radius: 0.8
      always_send_full_costmap: true
      transform_tolerance: 0.3

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0
    # GridBased (NavFn) serves Nav2's stock tree and the Navigate to Aisle Objectives;
    # SmacLattice serves the tree the driver launch file writes for Navigate with SMAC.
    planner_plugins: ["GridBased", "Smac2D", "ThetaStar", "SmacLattice"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true
    # Cost-aware grid alternatives share the same obstacle/inflation costmap.
    Smac2D:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.5
      allow_unknown: true
      max_planning_time: 3.0
    ThetaStar:
      plugin: "nav2_theta_star_planner::ThetaStarPlanner"
      how_many_corners: 8
      allow_unknown: true
      w_euc_cost: 1.0
      w_traversal_cost: 2.0
    # State Lattice with Nav2's differential-drive primitives at the costmap resolution:
    # it checks the footprint polygon at every pose of the plan.
    SmacLattice:
      plugin: "nav2_smac_planner::SmacPlannerLattice"
      lattice_filepath: "/opt/ros/jazzy/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json"
      allow_unknown: true
      # Cross-store plans on the fine grid need longer than the default.
      max_planning_time: 10.0

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    # Kept within the A300 controller yaw limit.
    max_rotational_vel: 1.2
    min_rotational_vel: 0.2
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [1.2, 0.0, 1.2]
    min_velocity: [-1.2, 0.0, -1.2]
    max_accel: [1.0, 0.0, 1.2]
    max_decel: [-2.0, 0.0, -1.2]
    odom_topic: "/odom_filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# SLAM uses wheel/IMU fused odometry, scan matching and loop closures.
slam_toolbox:
  ros__parameters:
    use_sim_time: false

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan_mapping
    mode: mapping

    debug_logging: true
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 1.0
    resolution: 0.05
    max_laser_range: 25.4
    minimum_time_interval: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.3
    minimum_travel_heading: 0.3
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.55
    loop_match_minimum_response_fine: 0.65

    # Correlation Parameters
    correlation_search_space_dimension: 0.02
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.0001
    angle_variance_penalty: 0.000001
    fine_search_angle_offset: 0.0001
    coarse_search_angle_offset: 0.0002
    coarse_angle_resolution: 0.0002
    minimum_angle_penalty: 0.001
    minimum_distance_penalty: 0.001
    use_response_expansion: false
