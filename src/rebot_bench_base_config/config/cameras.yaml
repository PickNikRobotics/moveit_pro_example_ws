# Opt in only when both USB cameras are connected. The arm always stays mock.
enable_cameras: false

# Shared RGB output settings. Use a color mode supported by both cameras.
image_width: 640
framerate: 30

# The two cameras differ in height on purpose. The D435 runs a supported 4:3
# color mode. The OAK takes its ISP output at an explicit 1/2 scale, which turns
# its whole 1280x800 sensor into 640x400 - the full 97.1 deg view, and correct
# published intrinsics. The video path at 640x480 would instead crop to the
# central 640x480, a 59.1 deg view. See README.md; the mounts are still
# uncalibrated either way.
wrist_image_height: 480
scene_image_height: 400

# Empty selects the attached D435; set a serial if more than one is connected.
wrist_serial_no: ""
scene_serial_no: "14442C10A119EAD600"
# OAK encodes MJPEG on-device before USB transfer; the driver decodes to bgr8.
scene_mjpeg_quality: 95

# Also run the OAK's stereo depth, aligned to its colour camera (CAM_A) at the
# colour stream's 640x400, and turn it into a point cloud: depth on
# /scene_camera/depth/image_rect_raw and points on
# /scene_camera/depth/color/points, both in scene_camera_color_optical_frame.
# Stack and Unstack Cycle confirms each stack from it; set false to run colour
# only, and the cycle then fails at its first stack check.
scene_aligned_depth: true

# Multiplies every scene depth before the point cloud is built. This OAK's
# stereo depth reads 4% long: on 2026-10-13 a factor of 0.96 put the mat at
# 0 mm (median of 11,000 points, was -24 mm) and a 100 mm blue-on-red stack's
# top at 100 mm (was 80 mm), in the calibrated world frame. Re-measure it for
# another camera or after recalibrating; 1.0 publishes the depth unchanged.
scene_depth_scale: 0.96
