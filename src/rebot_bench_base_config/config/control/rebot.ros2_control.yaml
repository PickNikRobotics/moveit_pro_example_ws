controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_admittance_controller:
      type: joint_trajectory_admittance_controller/JointTrajectoryAdmittanceController
    joint_velocity_controller:
      type: joint_velocity_controller/JointVelocityController
    gripper_joint_velocity_controller:
      type: joint_velocity_controller/JointVelocityController
    velocity_force_controller:
      type: velocity_force_controller/VelocityForceController
joint_state_broadcaster:
  ros__parameters:
    joints:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    - joint7
    interfaces:
    - position
    - velocity
joint_trajectory_admittance_controller:
  ros__parameters:
    # All seven motor joints (the arm plus the gripper motor). A goal for the arm or gripper group
    # alone is partial: the joints it leaves out are commanded to their measured positions.
    planning_group_name: manipulator_and_gripper
    sensor_frames: [gripper_end]
    ee_frames: [gripper_end]
    # No ft_sensor_names: there is no force/torque sensor, so this runs as a plain trajectory
    # controller without admittance.
    # One per joint in group order (joint1-joint7): the measured teleop limits, the braking
    # proven on the bench. The arm's planning limits in config/moveit/joint_limits.yaml are twice these.
    stop_accelerations: [0.6, 0.6, 0.6, 0.6, 0.6, 0.6, 6.0]
    # Both apply to every joint and are sized for motion (impedance) mode, which sends no gravity
    # feedforward: a loaded joint lags and settles short by load torque / kp, measured at up to
    # 0.088 rad. A goal whose first point is further than the path tolerance from the measured
    # position is rejected before anything moves, as is any deviation this large while moving.
    default_path_tolerance: 0.15
    default_goal_tolerance: 0.1
    default_goal_time_tolerance: 2.0
joint_velocity_controller:
  ros__parameters:
    planning_group_name: manipulator
    max_joint_velocity:
    - 0.3
    - 0.3
    - 0.3
    - 0.3
    - 0.3
    - 0.3
    max_joint_acceleration:
    - 0.6
    - 0.6
    - 0.6
    - 0.6
    - 0.6
    - 0.6
    command_interfaces:
    - position
    joint_limit_position_tolerance: 0.02
    command_timeout: 0.2
    state_publish_rate: 20
gripper_joint_velocity_controller:
  ros__parameters:
    planning_group_name: gripper
    max_joint_velocity: [3.0]
    max_joint_acceleration: [6.0]
    command_interfaces: [position]
    joint_limit_position_tolerance: 0.02
    command_timeout: 0.2
    state_publish_rate: 20
velocity_force_controller:
  ros__parameters:
    planning_group_name: manipulator
    ee_frame: gripper_end
    sensor_frame: gripper_end
    ft_sensor_name: ''
    command_interfaces:
    - position
    max_joint_velocity:
    - 0.3
    - 0.3
    - 0.3
    - 0.3
    - 0.3
    - 0.3
    max_joint_acceleration:
    - 0.6
    - 0.6
    - 0.6
    - 0.6
    - 0.6
    - 0.6
    max_cartesian_velocity:
    - 0.25
    - 0.25
    - 0.25
    - 1.0
    - 1.0
    - 1.0
    max_cartesian_acceleration:
    - 2.0
    - 2.0
    - 2.0
    - 4.0
    - 4.0
    - 4.0
    state_publish_rate: 10
    jacobian_damping: 0.005
    command_timeout: 0.2
    joint_limit_position_tolerance: 0.02
