# Mock by default, with optional real RGB cameras. Switch the arm to the real
# RobStride driver by setting hardware_interface to "real" below; see README.md
# for the host CAN bring-up and the non-instanced-deployment requirement.
runtime_launch_file:
  package: rebot_bench_base_config
  path: launch/runtime.launch.xml
hardware:
  additional_driver_launch_file:
    package: rebot_bench_base_config
    path: launch/cameras.launch.py
  launch_control_node: true
  launch_robot_state_publisher: true
  robot_description:
    urdf:
      package: rebot_bench_base_config
      path: description/rebot.urdf.xacro
    urdf_params:
      # "mock" or "real". Real drives the seven RobStride motors over SocketCAN
      # and only works in a non-instanced deployment, where host can0 is visible.
      - hardware_interface: "mock"
      # Real only. The single 1 Mbps bus the bench arm is wired to.
      - can_interface: "can0"
      # Real only. "false" brings the arm up readable but limp - state is
      # published and the joints move by hand, nothing is commanded. Use it for
      # the first session on a new arm, then switch to "true".
      - torque_enable: "true"
      # Real only. joint1-joint6 control: "motion" (impedance, the default) or
      # "position_csp" (the motor's own position loop). See the README.
      - arm_control_mode: "motion"
    srdf:
      package: rebot_bench_base_config
      path: config/moveit/rebot.srdf
ros_global_params:
  use_sim_time: false
moveit_params:
  joint_group_name: manipulator
  kinematics:
    package: rebot_bench_base_config
    path: config/moveit/pose_ik.yaml
  joint_limits:
    package: rebot_bench_base_config
    path: config/moveit/joint_limits.yaml
  pose_jog:
    package: rebot_bench_base_config
    path: config/moveit/pose_jog.yaml
  joint_jog:
    package: rebot_bench_base_config
    path: config/moveit/joint_jog.yaml
  publish:
    planning_scene: true
    geometry_updates: true
    state_updates: true
    transforms_updates: true
  trajectory_execution:
    manage_controllers: true
    allowed_execution_duration_scaling: 2.0
    allowed_goal_duration_margin: 5.0
    allowed_start_tolerance: 0.01
ros2_control:
  config:
    package: rebot_bench_base_config
    path: config/control/rebot.ros2_control.yaml
  controllers_active_at_startup:
  - joint_state_broadcaster
  - joint_trajectory_controller
  controllers_inactive_at_startup:
  - joint_velocity_controller
  - gripper_joint_velocity_controller
  - velocity_force_controller
  controllers_not_managed: []
  controller_shared_topics: []
objectives:
  behavior_loader_plugins:
    core:
    - moveit_pro::behaviors::CoreBehaviorsLoader
    - moveit_pro::behaviors::MTCCoreBehaviorsLoader
    - moveit_pro::behaviors::VisionBehaviorsLoader
    - moveit_pro::behaviors::ConverterBehaviorsLoader
  objective_library_paths:
    core_objectives:
      package_name: moveit_pro_objectives
      relative_path: objectives/core
    motion_objectives:
      package_name: moveit_pro_objectives
      relative_path: objectives/motion
    perception_objectives:
      package_name: moveit_pro_objectives
      relative_path: objectives/perception
    visualization_objectives:
      package_name: moveit_pro_objectives
      relative_path: objectives/visualization
    rebot_objectives:
      package_name: rebot_bench_base_config
      relative_path: objectives
  waypoints_file:
    package_name: rebot_bench_base_config
    relative_path: waypoints/rebot_waypoints.yaml
