# Mock by default, with optional real cameras. Switch the arm to the real
# RobStride driver by setting hardware_interface to "real" below; see README.md
# for the host CAN bring-up and the non-instanced-deployment requirement.
runtime_launch_file:
  package: rebot_bench_base_config
  path: launch/runtime.launch.xml
hardware:
  additional_driver_launch_file:
    package: rebot_bench_base_config
    path: launch/rebot_drivers.launch.py
  launch_control_node: true
  launch_robot_state_publisher: true
  robot_description:
    urdf:
      package: rebot_bench_base_config
      path: description/rebot.urdf.xacro
    urdf_params:
      # "mock" or "real". Real drives the seven RobStride motors over SocketCAN
      # and only works in a non-instanced deployment, where host can0 is visible.
      - hardware_interface: "mock"
      # Real only. The single 1 Mbps bus the bench arm is wired to.
      - can_interface: "can0"
      # Real only. Startup engages torque at HOME. "false" retains the existing
      # readable-but-limp commissioning option; use only at supported rest.
      - torque_enable: "true"
      # Driver-owned latched trip; runtime returns HOME before torque OFF.
      - thermal_cutoff_c: "100.0"
      # Real only. joint1-joint6 control: "position_csp" (the motor's own
      # position loop) or "motion" (impedance, the Xacro default). See the README.
      - arm_control_mode: "position_csp"
      # Bench-specific placements in the printed TF frame (world, z = 0 on the
      # mat top), from the 2026-10-11 ChArUco calibration; re-measure and
      # override them for any other installation (README.md). base_link: x, y
      # and yaw from the hand-eye solve. The base plate is bolted level, so
      # roll and pitch are 0; it sits on the bench top under the 3 mm mat,
      # z = -0.003.
      - world_to_base_xyz: "0.7259 0.0216 -0.003"
      - world_to_base_rpy: "0 0 3.1380"
      # scene_camera_link (REP-103), from the same calibration's scene camera
      # board pose.
      - scene_camera_xyz: "-0.075 0.069 0.565"
      - scene_camera_rpy: "0.169 0.975 0.246"
    srdf:
      package: rebot_bench_base_config
      path: config/moveit/rebot.srdf
ros_global_params:
  use_sim_time: false
  # Enable the calibrated FashionStar USB leader for mock, real or the sim overlay.
  # Backend drivers own the reader and bridge; no separate ros2 launch command.
  rebot_leader_enabled: false
  rebot_leader_port: "/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0"
  rebot_leader_id: "rebot_arm_102_leader"
  # Existing bench calibration, installed with this package; never recalibrated.
  rebot_leader_calibration_file: "config/leader_calibration/rebot_arm_102_leader.json"
  rebot_leader_publish_rate: 100.0
moveit_params:
  joint_group_name: manipulator
  kinematics:
    package: rebot_bench_base_config
    path: config/moveit/pose_ik.yaml
  joint_limits:
    package: rebot_bench_base_config
    path: config/moveit/joint_limits.yaml
  pose_jog:
    package: rebot_bench_base_config
    path: config/moveit/pose_jog.yaml
  joint_jog:
    package: rebot_bench_base_config
    path: config/moveit/joint_jog.yaml
  publish:
    planning_scene: true
    geometry_updates: true
    state_updates: true
    transforms_updates: true
  trajectory_execution:
    manage_controllers: true
    allowed_execution_duration_scaling: 2.0
    allowed_goal_duration_margin: 5.0
    allowed_start_tolerance: 0.01
ros2_control:
  config:
    package: rebot_bench_base_config
    path: config/control/rebot.ros2_control.yaml
  controllers_active_at_startup:
  - joint_state_broadcaster
  - joint_trajectory_admittance_controller
  controllers_inactive_at_startup:
  - leader_position_controller
  - joint_velocity_controller
  - gripper_joint_velocity_controller
  - velocity_force_controller
  controllers_not_managed: []
  controller_shared_topics: []
objectives:
  behavior_loader_plugins:
    rebot:
    - rebot_bench_behaviors::RebotBenchBehaviorsLoader
    core:
    - moveit_pro::behaviors::CoreBehaviorsLoader
    - moveit_pro::behaviors::MTCCoreBehaviorsLoader
    - moveit_pro::behaviors::VisionBehaviorsLoader
    - moveit_pro::behaviors::ConverterBehaviorsLoader
  objective_library_paths:
    core_objectives:
      package_name: moveit_pro_objectives
      relative_path: objectives/core
    motion_objectives:
      package_name: moveit_pro_objectives
      relative_path: objectives/motion
    perception_objectives:
      package_name: moveit_pro_objectives
      relative_path: objectives/perception
    visualization_objectives:
      package_name: moveit_pro_objectives
      relative_path: objectives/visualization
    rebot_objectives:
      package_name: rebot_bench_base_config
      relative_path: objectives
  waypoints_file:
    package_name: rebot_bench_base_config
    relative_path: waypoints/rebot_waypoints.yaml
