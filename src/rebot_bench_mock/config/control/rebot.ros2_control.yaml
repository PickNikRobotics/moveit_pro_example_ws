controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    joint_velocity_controller:
      type: joint_velocity_controller/JointVelocityController
    velocity_force_controller:
      type: velocity_force_controller/VelocityForceController
joint_state_broadcaster:
  ros__parameters:
    joints:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    - joint7
    interfaces:
    - position
    - velocity
joint_trajectory_controller:
  ros__parameters:
    joints:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    - joint7
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    allow_partial_joints_goal: true
    allow_nonzero_velocity_at_trajectory_end: true
    constraints:
      goal_time: 2.0
      joint1:
        trajectory: 0.1
        goal: 0.01
      joint2:
        trajectory: 0.1
        goal: 0.01
      joint3:
        trajectory: 0.1
        goal: 0.01
      joint4:
        trajectory: 0.1
        goal: 0.01
      joint5:
        trajectory: 0.1
        goal: 0.01
      joint6:
        trajectory: 0.1
        goal: 0.01
      joint7:
        trajectory: 0.1
        goal: 0.01
joint_velocity_controller:
  ros__parameters:
    planning_group_name: manipulator
    max_joint_velocity:
    - 0.3
    - 0.3
    - 0.3
    - 0.3
    - 0.3
    - 0.3
    max_joint_acceleration:
    - 0.6
    - 0.6
    - 0.6
    - 0.6
    - 0.6
    - 0.6
    command_interfaces:
    - position
    joint_limit_position_tolerance: 0.02
    command_timeout: 0.2
    state_publish_rate: 20
velocity_force_controller:
  ros__parameters:
    planning_group_name: manipulator
    ee_frame: gripper_end
    sensor_frame: gripper_end
    ft_sensor_name: ''
    command_interfaces:
    - position
    max_joint_velocity:
    - 0.3
    - 0.3
    - 0.3
    - 0.3
    - 0.3
    - 0.3
    max_joint_acceleration:
    - 0.6
    - 0.6
    - 0.6
    - 0.6
    - 0.6
    - 0.6
    max_cartesian_velocity:
    - 0.25
    - 0.25
    - 0.25
    - 1.0
    - 1.0
    - 1.0
    max_cartesian_acceleration:
    - 2.0
    - 2.0
    - 2.0
    - 4.0
    - 4.0
    - 4.0
    state_publish_rate: 10
    jacobian_damping: 0.005
    command_timeout: 0.2
    joint_limit_position_tolerance: 0.02
