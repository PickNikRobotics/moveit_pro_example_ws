# pi0.5 LoRA-backbone recipe for the Kinova color-cube stacking dataset.

policy:
  path: lerobot/pi05_base
  push_to_hub: false
  dtype: bfloat16
  gradient_checkpointing: false  # enable to prevent OOM on smaller GPUs
  train_expert_only: false
  use_relative_actions: false
  optimizer_lr: 2.5e-5
  optimizer_weight_decay: 0.01
  scheduler_decay_steps: 50000  # keep in sync with `steps` below

dataset:
  repo_id: PickNikRobotics/kinova-color-cube-stack-mujoco
  revision: main
  video_backend: pyav
  # Pro-recorded datasets carry no image statistics, and pi0.5 normalizes images
  # with IDENTITY so nothing reads them. Left true, LeRobot fails writing ImageNet
  # constants into a camera entry that does not exist. See backfill_stats.py.
  use_imagenet_stats: false
  image_transforms:
    enable: false  # enable to improve robustness to image variance

# LoRA the gemma_2b backbone LM; train the action expert and projection heads
# densely; leave SigLIP frozen.
peft:
  method_type: LORA
  r: 32
  lora_alpha: 64 
  target_modules: '.*paligemma\.model\.language_model\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|mlp\.(gate|up|down)_proj)'
  full_training_modules:
    - gemma_expert.model
    - action_in_proj
    - action_out_proj
    - time_mlp_in
    - time_mlp_out

# This config's cameras -> pi0.5's DROID slots.
rename_map:
  observation.images.overview: observation.images.base_0_rgb
  observation.images.wrist: observation.images.left_wrist_0_rgb
  observation.images.scene: observation.images.right_wrist_0_rgb

steps: 50000
batch_size: 4
save_freq: 10000
seed: 1000

num_workers: 8  # lower this first if the run OOMs at a checkpoint save

wandb:
  enable: false
  disable_artifact: true
  # project: project_name
  # entity: entity_name
