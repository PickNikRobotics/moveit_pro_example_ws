controller_manager:
  ros__parameters:
    update_rate: 100 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    platform_velocity_controller:
      type: diff_drive_controller/DiffDriveController

# Husky A300 is a 4-wheel skid-steer base: two wheels per side driven together. Controller name
# and calibration values match the real robot's controllers_a300.yaml, not the URDF geometry:
# wheel_separation/wheel_radius here are the loaded rolling-radius calibration (0.562/0.1625),
# not the wheel's physical dimensions (0.1651 in the URDF).
platform_velocity_controller:
  ros__parameters:
    left_wheel_names: ["front_left_wheel_joint", "rear_left_wheel_joint"]
    right_wheel_names: ["front_right_wheel_joint", "rear_right_wheel_joint"]
    wheels_per_side: 2

    wheel_separation: 0.562
    wheel_separation_multiplier: 1.75
    wheel_radius: 0.1625
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    # base_link sits above true ground contact (see husky_a300_blank_world.xacro's footprint_joint
    # comment), so the controller publishes odom->footprint - the REP105 ground frame the xacro
    # wrapper adds as base_link's parent - not odom->base_link directly.
    base_frame_id: footprint
    # A state estimator (fuse, matching hangar_sim's config) will own odom->footprint once the
    # sensor port lands; until then keep the controller's own TF so it is not broken mid-port.
    enable_odom_tf: true

    # Mock hardware has no independent wheel-slip dynamics to feed back, so run open loop:
    # command velocity integrates directly into published odometry.
    open_loop: true

    cmd_vel_timeout: 0.5

    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.max_velocity: 0.8
    # Asymmetric accel/decel limits carried from the real robot. Sign convention is the
    # controller's: max_acceleration/max_deceleration_reverse are >= 0, the other two <= 0.
    linear.x.max_acceleration: 2.0
    linear.x.max_deceleration: -4.0
    linear.x.max_acceleration_reverse: -2.0
    linear.x.max_deceleration_reverse: 4.0

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.max_velocity: 2.0
    angular.z.max_acceleration: 4.0
    angular.z.max_deceleration: -4.0
    angular.z.max_acceleration_reverse: -4.0
    angular.z.max_deceleration_reverse: 4.0
