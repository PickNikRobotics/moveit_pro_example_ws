# Serving config for the inference_qnn_worker on a Qualcomm IQ10 (`VLA_QNN_HOST: iq10`):
# the Kinova cube-stacking GR00T N1.7 bundle on the Hexagon NPU. vla_serving.yaml
# documents every key; docker/README.md, "Serve on the IQ10 NPU", covers the bundle.

moveit_pro_trainer_handoff_version: 1
checkpoint: PickNikRobotics/groot_n17_kinova_cube_stack_20k
checkpoint_revision: "9ae9fc1b33af4baa0e0bb82ed54618a108a72716"
checkpoint_requires_hf_token: false
policy_class: groot
backend: qnn
qnn_bundle: /models/groot_n17_kinova_cube_stack_20k_iq10_qnn/bundle.json
fps: 10.0
device: auto
int8: false
state_dim: 8
state_names: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6, joint_7, robotiq_85_left_knuckle_joint]
action_names: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6, joint_7, robotiq_85_left_knuckle_joint]
guidance_horizon: 8
rtc_schedule: EXP
groot_rtc_ramp_rate: 0
