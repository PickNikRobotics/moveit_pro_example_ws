worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    # Minimal, so a rejected or limited request can still be traced to a
    # client. No headers and no body, because the bearer token is in a header.
    log_format minimal '$remote_addr $request_method $uri $status $request_time';
    access_log /dev/stdout minimal;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Sized to a multi-camera observation with headroom, since nginx spools
    # the whole body into the tmpfs before the upstream authenticates it.
    client_max_body_size 8m;
    client_body_buffer_size 1m;
    client_header_timeout 9s;
    client_body_timeout 9s;
    send_timeout 9s;
    # Longer than one inference round trip, so the robot's connection
    # survives between action chunks instead of re-handshaking TLS on
    # every call.
    keepalive_timeout 65s;
    large_client_header_buffers 2 8k;
    # Keyed per server, because the policy server handles one inference at a
    # time.
    limit_conn_zone $server_name zone=inference_requests:1m;
    # Keyed per client, so one peer cannot take every connection slot and lock
    # the robot out. nginx counts a connection from the preaccess phase, so an
    # accepted one holds its slot for the whole body read.
    limit_conn_zone $binary_remote_addr zone=ingress:1m;
    limit_conn_status 503;

    # Docker's embedded DNS, re-checked every 10s. A variable in proxy_pass
    # defers the upstream lookup to request time, so restarting the inference
    # container alone is enough. An upstream block resolves its host once at
    # startup and caches the address for the life of the process.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Applied before proxy_connect_timeout. Its 30s default outlasts every
    # other timeout here when Docker's DNS stalls.
    resolver_timeout 2s;

    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /etc/inference-tls/fullchain.pem;
        ssl_certificate_key /etc/inference-tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        limit_conn ingress 8;
        proxy_connect_timeout 1s;
        # Above the adapter's 9s default budget, so the robot gives up first
        # and reports the inference latency itself. A 504 from here reaches the
        # adapter as a gateway error with no body, whose message names
        # reachability rather than a slow policy. Raise these too when
        # MOVEIT_INFERENCE_HTTP_TIMEOUT goes past 12s.
        proxy_read_timeout 12s;
        proxy_send_timeout 12s;
        # A 258 KB chunk overflows the default buffers and spools to /tmp.
        proxy_buffers 8 32k;
        proxy_max_temp_file_size 0;
        proxy_set_header Accept-Encoding identity;

        set $policy inference:8973;

        location = /infer {
            if ($request_method != POST) { return 405; }
            limit_conn inference_requests 1;
            # Drops a peer that pauses more than 2s between reads. A steady trickle is not bounded here; the firewall rule restricting this port to the robot is what keeps other peers off the single slot above.
            client_body_timeout 2s;
            proxy_pass http://$policy/infer;
        }

        location = /status {
            if ($request_method != GET) { return 405; }
            # A status read carries no body. The http-level ceiling lets an
            # unauthenticated peer spool megabytes into the container's
            # RAM-backed /tmp before the upstream sees the request.
            client_max_body_size 1k;
            proxy_pass http://$policy/status;
        }

        location / {
            return 404;
        }
    }
}
