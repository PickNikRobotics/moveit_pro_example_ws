# Docker Compose file that will be merged with /opt/moveit_pro/docker-compose.yaml.
# For more details on how merging works, see https://docs.docker.com/compose/how-tos/multiple-compose-files/merge/#merging-rules.

# Services that are listed under `/opt/moveit_pro/docker-compose.yaml` are mirrored here for merging.
# Feel free to remove services here that are unmodified.
#

# Shared by `runtime` and `dev`. HTTPS selects externally managed inference;
# HTTP stays on loopback. MOVEIT_INFERENCE_HTTP_TIMEOUT is forwarded only when
# set on the host, so the launch file's default applies otherwise.
x-remote-inference-environment: &remote-inference-env
  - INFER_URL=${INFER_URL:-http://127.0.0.1:${MOVEIT_INFERENCE_PORT:-8973}/infer}
  - MOVEIT_INFERENCE_CA_FILE=${MOVEIT_INFERENCE_CA_FILE:+/run/inference-ca.pem}
  - MOVEIT_INFERENCE_HTTP_TIMEOUT

# Every service that builds the workspace image. Set INSTALL_NYX=true on the
# host to install the optional Nyx renderer (src/market_sim/README.md).
x-nyx-build: &nyx-build
  args:
    INSTALL_NYX: ${INSTALL_NYX:-false}

services:

  # The base image that all MoveIt Pro services extend off of. Builds the user workspace.
  base:
    build: *nyx-build

  # Starts the MoveIt Pro Runtime: the Agent and the web bridge the
  # MoveIt Pro Desktop App connects to.
  runtime:
    build: *nyx-build
    environment: *remote-inference-env
    volumes:
      - ${MOVEIT_INFERENCE_CA_FILE:-/dev/null}:/run/inference-ca.pem:ro

  # Starts the robot drivers.
  drivers:
    build: *nyx-build
    environment:
      - MARKET_SIM_SLAM=${MARKET_SIM_SLAM:-false}
      - MARKET_SIM_GROUND_TRUTH_NAV=${MARKET_SIM_GROUND_TRUTH_NAV:-false}
    volumes:
      # Allow access to host hardware e.g. RealSense cameras
      - /dev:/dev

  # Developer specific configuration when running `moveit_pro dev`.
  dev:
    build: *nyx-build
    environment: *remote-inference-env
    volumes:
      - ${MOVEIT_INFERENCE_CA_FILE:-/dev/null}:/run/inference-ca.pem:ro
      # Allow access to host hardware e.g. RealSense cameras
      - /dev:/dev

  # LeRobot VLA inference server for the vla_sim config (src/vla_sim/docker/).
  # The workspace half of the product's `inference_server` skeleton (see
  # /opt/moveit_pro/docker-compose.yaml): the two same-named services merge,
  # with the product side owning lifecycle, GPU runtime, security, and the
  # published port. Only `moveit_pro run --with-inference-server` and
  # `--only-inference-server` build or start it. Model selection lives in
  # src/vla_sim/config/vla_serving.yaml, mounted at /vla_config; everything
  # below is a host setting.
  inference_server:
    # One suffix selects both the build stage and this tag, so a cached image built for another accelerator is never reused.
    image: ${COMPOSE_PROJECT_NAME:-moveit_pro}-inference_server${MOVEIT_INFERENCE_IMAGE_SUFFIX:-}${VLA_QNN_HOST:+-qnn}:latest
    # Declared here too, so a launcher whose compose file carries no
    # inference_server skeleton still gates this service instead of building
    # and starting it on every plain run and build.
    profiles: ["inference"]
    build:
      # Relative paths resolve against the compose project directory
      # (/opt/moveit_pro when the launcher runs this), so workspace paths must
      # go through MOVEIT_HOST_USER_WORKSPACE, same as the base service.
      context: ${MOVEIT_HOST_USER_WORKSPACE:-.}/src/vla_sim/docker
      dockerfile: Dockerfile.vla_inference_server
      args:
        MOVEIT_INFERENCE_IMAGE_SUFFIX: ${MOVEIT_INFERENCE_IMAGE_SUFFIX:-}${VLA_QNN_HOST:+-qnn}
        TORCH_INDEX: ${VLA_TORCH_INDEX:-}
    # Host facts only; model knobs and Trainer-provisioned Hugging Face access
    # are owned by MoveIt Pro.
    environment:
      # Explicit fallback for gated or private checkpoints configured outside
      # Trainer (the stock pi0.5 processor resolves the gated google/paligemma
      # tokenizer). The product compose file forwards the same variable; it is
      # repeated here so a launcher without that entry still delivers the
      # token. The two entries merge by key, and an empty value defers to the
      # Trainer-provisioned credential.
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - HF_HOME=/hf
      # Scratch home for the mapped user; only /hf persists. The image ships
      # a passwd entry for uid 1000 only, so USER keeps getpass.getuser()
      # (torch cache-dir setup) working when the host uid differs.
      - HOME=/tmp
      - USER=vla
      - VLA_QNN_WORKER_SOCKET=${VLA_QNN_HOST:+/run/vla_qnn/worker.sock}
    # required: false skips the worker where its profile is inactive (non-QNN hosts).
    depends_on:
      inference_qnn_worker:
        condition: service_started
        required: false
    volumes:
      - vla_qnn_ipc:/run/vla_qnn
      # Hub downloads (checkpoints, tokenizers) persist here across restarts.
      # The default is a workspace-owned folder that exists in every clone, so
      # docker never creates the bind source as root (a missing host path
      # would be created root-owned and the non-root container could not
      # write to it). Point VLA_HF_CACHE at an absolute path to reuse an
      # existing Hugging Face cache instead.
      - ${VLA_HF_CACHE:-${MOVEIT_HOST_USER_WORKSPACE:-.}/src/vla_sim/hf_cache}:/hf
      # Local checkpoints: drop a checkpoint directory into
      # src/vla_sim/models/ and set the vla_serving.yaml checkpoint to
      # /models/<checkpoint-dir>. VLA_MODELS_DIR overrides the host folder
      # for checkpoints stored elsewhere.
      - ${VLA_MODELS_DIR:-${MOVEIT_HOST_USER_WORKSPACE:-.}/src/vla_sim/models}:/models:ro
      # Model-serving config (checkpoint, fps, device, ...); edits trigger an
      # automatic model reload, with no image rebuild. Mounts the active robot
      # configuration package's config directory, because Trainer writes that
      # package's vla_serving.yaml. The default assumes the package lives at
      # src/<package>; set VLA_CONFIG_DIR for one nested elsewhere, such as
      # src/moveit_pro_kinova_configs/kinova_sim/config.
      - ${VLA_CONFIG_DIR:-${MOVEIT_HOST_USER_WORKSPACE:-.}/src/${MOVEIT_CONFIG_PACKAGE:-vla_sim}/config}:/vla_config:ro
      # The server script and its tests; edits take effect on restart, no
      # image rebuild, and `docker exec ... python -m unittest` reaches the
      # test suite (see src/vla_sim/docker/README.md).
      - ${MOVEIT_HOST_USER_WORKSPACE:-.}/src/vla_sim/docker:/app:ro

  # The Hexagon NPU half of the inference server, as root with host IPC/PID and
  # CAP_SYS_PTRACE, which amounts to host root. Off unless the host sets
  # VLA_QNN_HOST; design and security trade-off: src/vla_sim/docker/README.md,
  # "Serve on the IQ10 NPU".
  inference_qnn_worker:
    # Keep the first entry: with only the second, empty off a QNN host, Compose
    # treats the service as unprofiled and starts it on every host.
    profiles: ["inference-qnn", "${VLA_QNN_HOST:+inference}"]
    # Built by inference_server (same tag).
    image: ${COMPOSE_PROJECT_NAME:-moveit_pro}-inference_server${MOVEIT_INFERENCE_IMAGE_SUFFIX:-}${VLA_QNN_HOST:+-qnn}:latest
    pull_policy: never
    init: true
    command:
      - --unix-socket
      - /run/vla_qnn/worker.sock
      - --config
      - /vla_config/vla_serving_${VLA_QNN_HOST:-}.yaml
    user: "0:0"
    network_mode: none
    ipc: host
    pid: host
    cap_drop:
      - ALL
    cap_add:
      - SYS_PTRACE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 512
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      - MOVEIT_INFERENCE_KEY=${MOVEIT_INFERENCE_KEY:-}
      # A root process must not write root-owned files into the shared Hub cache.
      - HF_HUB_OFFLINE=1
      - HF_HOME=/hf
      - HOME=/tmp
      - QNN_HTP_BURST=${QNN_HTP_BURST:-1}
    volumes:
      - vla_qnn_ipc:/run/vla_qnn
      - ${VLA_HF_CACHE:-${MOVEIT_HOST_USER_WORKSPACE:-.}/src/vla_sim/hf_cache}:/hf:ro
      - ${VLA_MODELS_DIR:-${MOVEIT_HOST_USER_WORKSPACE:-.}/src/vla_sim/models}:/models:ro
      - ${VLA_CONFIG_DIR:-${MOVEIT_HOST_USER_WORKSPACE:-.}/src/${MOVEIT_CONFIG_PACKAGE:-vla_sim}/config}:/vla_config:ro
      - ${MOVEIT_HOST_USER_WORKSPACE:-.}/src/vla_sim/docker:/app:ro
      # create_host_path: false makes a missing host file fail `up` instead of
      # Docker creating a root-owned empty directory in its place.
      - type: bind
        source: ${VLA_QNN_CDSPRPC_LIBRARY:-/usr/lib/libcdsprpc.so}
        target: /usr/lib/libcdsprpc.so
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VLA_QNN_KIUMD_LIBRARY:-/lib/libkiumd.so}
        target: /lib/libkiumd.so
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VLA_QNN_LRMC_LIBRARY:-/lib/liblrmc.so}
        target: /lib/liblrmc.so
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VLA_QNN_DSP_DIR:-/vendor/dsp}
        target: /vendor/dsp
        read_only: true
        bind:
          create_host_path: false

volumes:
  vla_qnn_ipc:
