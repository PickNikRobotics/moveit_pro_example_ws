name: Backport merged pull request

# The job itself lives in moveit_pro_ci's shared `backport.yaml`. This file
# supplies the triggers and the backport App credentials.
on:
  pull_request_target:
    types: [closed]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  backport:
    uses: PickNikRobotics/moveit_pro_ci/.github/workflows/backport.yaml@9ad6957ce0a9cfc8af294824e6d6593b053bbfb5 # v0.10.0
    secrets:
      backport_app_client_id: ${{ secrets.BACKPORT_APP_CLIENT_ID }}
      backport_app_private_key: ${{ secrets.BACKPORT_APP_PRIVATE_KEY }}
