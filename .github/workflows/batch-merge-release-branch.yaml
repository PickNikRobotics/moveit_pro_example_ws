name: Batch Merge Release Branch

on:
  workflow_dispatch:

  schedule:
    - cron: '0 5 * * 1-5' # Run before every weekday at 05:00 UTC

permissions:
  contents: write
  pull-requests: write

# A dispatch overlapping the schedule must not supersede another active run's PR.
concurrency:
  group: batch-merge-release-branch
  cancel-in-progress: false

jobs:
  batch-merge-release-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          lfs: false

      - name: Get current release branch
        id: get_current_release_branch
        uses: PickNikRobotics/moveit_pro_ci/.github/actions/find_release_branch@d12201d45eaa1fd65fec5d201340ac85b4dd63b8 # v0.10.1

      - name: Merge release branch into main
        id: merge
        env:
          RELEASE_BRANCH: ${{ steps.get_current_release_branch.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          RAND_SUFFIX=$RANDOM
          TEMP_BRANCH="merge-$RELEASE_BRANCH-main-$RAND_SUFFIX"
          git checkout -b "$TEMP_BRANCH"
          git fetch origin "$RELEASE_BRANCH"

          # Skip only when the resulting clean merge would leave main's tree unchanged.
          # `git merge-tree --write-tree` returns 0 for a clean merge, 1 for conflicts,
          # and another nonzero status for errors.
          if merge_tree=$(git merge-tree --write-tree main "origin/$RELEASE_BRANCH"); then
            main_tree=$(git rev-parse "main^{tree}")
            if [ "$merge_tree" = "$main_tree" ]; then
              echo "# Release branch has no changes to merge into main" >> "$GITHUB_STEP_SUMMARY"
              git checkout main
              git branch -D "$TEMP_BRANCH"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            merge_tree_status=$?
            if [ "$merge_tree_status" -ne 1 ]; then
              echo "# Failed to compute the release branch merge result" >> "$GITHUB_STEP_SUMMARY"
              exit "$merge_tree_status"
            fi
          fi

          if git merge "origin/$RELEASE_BRANCH" --no-edit; then
            echo "# Merge succeeded without conflicts" >> $GITHUB_STEP_SUMMARY
            PR_BODY="Ready for merge!"
          else
            echo "# Merge failed with conflicts" >> $GITHUB_STEP_SUMMARY

            # `git add -A` can't stage a conflicted submodule that isn't checked out.
            # That happens when the release branch bumps a submodule that main has
            # vendored or deleted. Keep main's side and list what was dropped.
            # A file/directory conflict moves the release side to "<path>~origin_<branch>".
            CONFLICT_SUFFIX="~origin_${RELEASE_BRANCH//\//_}"
            DROPPED_SUBMODULES=""
            while IFS= read -r -d '' entry; do
              path=${entry#*$'\t'}
              read -r mode sha stage <<< "${entry%%$'\t'*}"
              [ "$mode" = 160000 ] && [ "$stage" = 3 ] || continue
              if [ "$(git --literal-pathspecs ls-tree --format='%(objectmode)' HEAD -- "$path")" = 160000 ]; then
                git update-index --cacheinfo "160000,$(git rev-parse "HEAD:$path"),$path"
              else
                git --literal-pathspecs rm --cached -q -- "$path"
                rm -rf -- "$path"
              fi
              DROPPED_SUBMODULES+="- \`${path%"$CONFLICT_SUFFIX"}\` at $sha"$'\n'
            done < <(git ls-files -u -z)

            git add -A
            git commit -m "Merge $RELEASE_BRANCH into main (with conflicts)"
            PR_BODY="⚠️Merge failed with conflicts! Please pull this branch and manually resolve the conflict by resetting this branch and re-merging."
            if [ -n "$DROPPED_SUBMODULES" ]; then
              PR_BODY+=$'\n\nThese submodule updates from the release branch were dropped in favor of main:\n'"$DROPPED_SUBMODULES"
            fi
          fi
          git push origin "$TEMP_BRANCH"
          # An individual, not the infrastructure-devs team: requesting a team review
          # needs a token with org Members:read, and every permission available to
          # secrets.GITHUB_TOKEN is repository-scoped. Tracked in PickNikRobotics/moveit_pro#21478.
          pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --title "Merge $RELEASE_BRANCH into main" --body "$PR_BODY" --base main --head "$TEMP_BRANCH" --draft --reviewer JWhitleyWork)
          echo "number=${pr_url##*/}" >> "$GITHUB_OUTPUT"

      - name: Close superseded merge pull requests
        if: steps.merge.outputs.skip != 'true'
        env:
          RELEASE_BRANCH: ${{ steps.get_current_release_branch.outputs.branch }}
          NEW_PR_NUMBER: ${{ steps.merge.outputs.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Match both title variants and the generated head in this repository; a title alone could belong to a manual PR or a fork.
          # Paginate before closing anything so API failures leave the existing PRs open.
          prs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100")
          superseded=$(printf '%s\n' "$prs" | jq -r \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg title "Merge $RELEASE_BRANCH into main" \
            --arg prefix "merge-$RELEASE_BRANCH-main-" \
            --argjson new "$NEW_PR_NUMBER" '
              .[]
              | select(.state == "open" and .base.ref == "main" and .number < $new)
              | select(.head.repo.full_name == $repo)
              | select(.title == $title or .title == ($title + " (conflicts resolved by Claude)"))
              | select(.head.ref | startswith($prefix))
              | select(.head.ref | ltrimstr($prefix) | test("^[0-9]+$"))
              | .number')
          for number in $superseded; do
            gh pr close "$number" --repo "$GITHUB_REPOSITORY" --comment "Superseded by #$NEW_PR_NUMBER"
          done
